<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kísérleti Lőtér</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Elrendezés: lőtéri irányítópult. Felül állapotsor, középen görgethető lap, alul fülek; az indítás teljes képernyős vászon. */
  --ink:#0d1726; --panel:#15233a; --line:#2a3c5c; --paper:#e9e4d6; --dim:#8fa0b8;
  --flame:#ff8a2b; --trace:#63d3e6; --ok:#7bd48a; --bad:#ff5d4d;
  --disp:'Big Shoulders Display','Arial Narrow',sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font:15px/1.45 var(--body);display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 16px 8px;border-bottom:1px solid var(--line);background:linear-gradient(#101c30,#0d1726)}
.brand{font:800 22px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase}
.brand b{color:var(--flame)}
#stat{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font:400 12px var(--mono);color:var(--dim)}
#stat span b{color:var(--paper);font-weight:600}
main{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px;background-image:linear-gradient(rgba(99,211,230,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(99,211,230,.035) 1px,transparent 1px);background-size:24px 24px}
nav{display:flex;border-top:1px solid var(--line);background:#0a1220}
nav button{flex:1;min-width:0;padding:12px 0;background:none;border:0;border-top:3px solid transparent;color:var(--dim);font:600 12px var(--disp);letter-spacing:0;text-transform:uppercase;white-space:nowrap;overflow:hidden}
nav button[aria-current=true]{color:var(--paper);border-top-color:var(--flame);background:linear-gradient(rgba(255,138,43,.16),transparent)}
.card{background:linear-gradient(#192a45,#13203a);border:1px solid var(--line);border-radius:5px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 6px 18px rgba(0,0,0,.28);flex:none}
.hero{padding:0;position:relative;overflow:hidden}
#hero{width:100%;aspect-ratio:2/1;display:block}
.herot{position:absolute;left:14px;top:12px;width:46%;display:flex;flex-direction:column;gap:6px}
.big{font:800 26px/1 var(--disp);letter-spacing:.03em;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.herot .eyebrow{color:var(--paper);text-shadow:0 1px 6px rgba(0,0,0,.7)}
.prog{height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--flame)}
h2::before{content:'';display:inline-block;width:12px;height:3px;background:var(--flame);margin-right:8px;vertical-align:middle}
h2{font:800 20px/1.1 var(--disp);letter-spacing:.05em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font:600 14px var(--body);margin:0}
p{margin:0;max-width:65ch}
.dim{color:var(--dim);font-size:13px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--trace)}
button.act{background:linear-gradient(#ffa350,#f07a1c);box-shadow:0 2px 10px rgba(255,138,43,.3);color:#1a0d02;border:0;border-radius:3px;padding:11px 14px;font:800 17px var(--disp);letter-spacing:.06em;text-transform:uppercase}
button.act:disabled{background:#3a4660;color:#8090a8;box-shadow:none}
button.sec{background:none;border:1px solid var(--line);color:var(--paper);border-radius:3px;padding:8px 12px;font:600 13px var(--body)}
button.sec:disabled{color:#5d6c85}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--trace);outline-offset:2px}
select{width:100%;background:#0d1726;color:var(--paper);border:1px solid var(--line);border-radius:3px;padding:8px;font:400 14px var(--body)}
label{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:4px}
output{font:600 13px var(--mono);color:var(--paper)}
input[type=range]{width:100%;accent-color:var(--flame);margin:2px 0 4px}
.rk{display:flex;gap:10px;align-items:flex-start}
.rk canvas{width:84px;height:220px;flex:none;border:1px dashed var(--line);border-radius:3px;background:#0b1422}
.stg{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.st{border-left:3px solid var(--line);padding-left:10px}
.stl{display:flex;justify-content:space-between;align-items:center;font:600 13px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.x{background:none;border:0;color:var(--bad);font:400 12px var(--mono);padding:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font:400 13px var(--mono);font-variant-numeric:tabular-nums}
.grid div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:2px 0}
.grid div span{color:var(--dim)}
.pill{display:inline-block;font:600 11px var(--mono);padding:2px 7px;border-radius:9px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.bad{color:var(--bad);border-color:var(--bad)} .pill.go{color:var(--flame);border-color:var(--flame)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tech{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.tech:first-of-type{border-top:0;padding-top:0}
.bar{height:10px;background:#0b1422;border:1px solid var(--line);border-radius:2px;display:flex;gap:2px;padding:1px}
.bar i{flex:1;background:#24344f} .bar i.on{background:var(--trace)} .bar i.min{background:var(--flame)}
.log{font:400 12px var(--mono);color:var(--dim);display:flex;flex-direction:column;gap:3px}
.fine{display:flex;gap:6px}
.fine button{flex:1}
#fly{position:fixed;inset:0;background:#000;z-index:10}
#fly[hidden]{display:none}
#cv{width:100%;height:100%;display:block}
#skip{position:absolute;right:14px;top:14px;background:rgba(13,23,38,.7);border:1px solid var(--line);color:var(--paper);padding:8px 12px;border-radius:3px;font:600 12px var(--mono)}
#res{position:absolute;left:12px;right:12px;bottom:12px;max-height:80%;overflow:auto;background:rgba(13,23,38,.94);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:8px}
#res[hidden]{display:none}
table{border-collapse:collapse;width:100%;font:400 12px var(--mono);font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)} th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:400}
.scroll{overflow-x:auto}
#wmap{width:100%;aspect-ratio:4/3;display:block;border:1px solid var(--line);border-radius:3px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
#mbtn{background:none;border:1px solid var(--line);color:var(--paper);border-radius:3px;padding:6px 12px;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase}
#ov{position:fixed;inset:0;z-index:20;background:rgba(6,11,20,.97);overflow-y:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:12px}
#ov[hidden]{display:none}
.ttlwrap{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
#tcv{width:100%;aspect-ratio:2/1;display:block;border:1px solid var(--line);border-radius:5px}
.ttl{font:800 52px/.92 var(--disp);letter-spacing:.04em;text-transform:uppercase}.ttl b{color:var(--flame);display:block}
.ttl.sm{font-size:38px}
#toast{position:fixed;left:12px;right:12px;top:10px;z-index:40;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.tst{background:#101c30;border:1px solid var(--ok);border-left:4px solid var(--ok);border-radius:4px;padding:9px 12px;font:600 13px var(--body);box-shadow:0 6px 18px rgba(0,0,0,.5);animation:tin .25s ease-out}
.tst.ach{border-color:var(--flame)}.tst.bad{border-color:var(--bad)}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}
@media(prefers-reduced-motion:reduce){.tst{animation:none}}
input[type=text],textarea{width:100%;min-width:0;background:#0d1726;color:var(--paper);border:1px solid var(--line);border-radius:3px;padding:9px;font:400 14px var(--body)}
textarea{font:400 11px var(--mono);resize:vertical;word-break:break-all}
.fine input[type=text]{flex:2}
.tip{border-left:3px solid var(--flame)}
.news h3{font:800 19px/1.15 var(--disp);letter-spacing:.02em}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:8px 4px;font-size:12px}
button.sec[aria-pressed=true]{border-color:var(--flame);color:var(--flame)}
.dif{display:flex;flex-direction:column;gap:2px;text-align:left}.dif b{font:800 17px var(--disp);letter-spacing:.05em;text-transform:uppercase}
.lock{opacity:.45}
.rtab{width:100%;border-collapse:collapse;font:12px var(--mono);margin:6px 0}.rtab th,.rtab td{padding:4px 3px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.rtab th{color:var(--dim);font-weight:600}.rtab tr.en td{color:var(--flame)}
</style>
</head>
<body>
<header><div class="hd"><div class="brand">Kísérleti <b>Lőtér</b></div><button id="mbtn" data-a="menu">Menü</button></div><div id="stat"></div></header>
<main id="main"></main>
<nav id="tabs"></nav>
<div id="fly" hidden><canvas id="cv"></canvas><button id="skip" data-a="skip">Ugrás a végére</button><div id="res" hidden></div></div>
<div id="ov" hidden></div><div id="toast" aria-live="polite"></div>

<script>
/* ---------- Fizika (DOM nélkül) ---------- */
const g0=9.80665, RE=6371000, MU=3.986004e14;
const ENG={
  a1:{n:'A-1 alkohol/LOX',F:300e3,isl:215,iv:248,m:900,sf:.16,c:3},
  sol:{n:'Sz-1 szilárd',F:420e3,isl:228,iv:258,m:350,sf:.14,c:2},
  k1:{n:'K-1 kerozin/LOX',F:440e3,isl:255,iv:290,m:650,sf:.10,c:5,t:'k1'},
  k2:{n:'K-2 nagynyomású kerozin',F:900e3,isl:283,iv:312,m:1100,sf:.08,c:9,t:'k2'},
  h1:{n:'H-1 hidrogén/LOX',F:110e3,isl:210,iv:444,m:260,sf:.14,c:11,t:'h1'},
  hyp:{n:'T-1 tárolható',F:450e3,isl:259,iv:292,m:600,sf:.09,c:5,t:'hyp'},
  sol2:{n:'S-2 kompozit szilárd',F:1200e3,isl:245,iv:275,m:500,sf:.09,c:6,t:'sol2'},
  k3:{n:'K-3 zárt ciklusú kerozin',F:1800e3,isl:311,iv:338,m:1500,sf:.07,c:16,t:'k3'},
  h2:{n:'H-2 nagy hidrogénhajtómű',F:1000e3,isl:366,iv:452,m:1800,sf:.13,c:28,t:'h2'},
  f1:{n:'F-1 óriás kerozinhajtómű',F:6800e3,isl:265,iv:304,m:8400,sf:.06,c:45,t:'f1'},
  ntr:{n:'N-1 nukleáris termikus',F:330e3,isl:380,iv:850,m:3500,sf:.16,c:40,t:'ntr'}
};
const WH={
  inst:{n:'Műszercsomag',m:300,y:0,c:0,mat:0},
  sat:{n:'Nehéz műszeres teher',m:2500,y:0,c:5,mat:0},
  crew:{n:'Űrkabin',m:5000,y:0,c:20,mat:0,t:'crew'},
  stat:{n:'Űrállomás-modul',m:20000,y:0,c:40,mat:0,t:'station'},
  lun:{n:'Holdkomp',m:15000,y:0,c:60,mat:0,t:'lunar'},
  fis1:{n:'Hasadó töltet I',m:4000,y:15,c:15,mat:3,nuc:1},
  fis2:{n:'Kompakt hasadó töltet',m:1000,y:50,c:15,mat:2,nuc:1},
  fis3:{n:'Nagy hatóerejű hasadó töltet',m:1200,y:150,c:18,mat:3,nuc:1},
  fus1:{n:'Fúziós töltet I',m:2500,y:1000,c:25,mat:4,nuc:1,fus:1},
  fus2:{n:'Kompakt fúziós töltet',m:700,y:500,c:25,mat:3,nuc:1,fus:1},
  fus3:{n:'Nagy fúziós töltet',m:4000,y:5000,c:30,mat:5,nuc:1,fus:1},
  fus4:{n:'Többmegatonnás kísérleti eszköz',m:15000,y:25000,c:40,mat:7,nuc:1,fus:1},
  fus5:{n:'Óriás kísérleti eszköz',m:27000,y:50000,c:50,mat:9,nuc:1,fus:1}
};
let CONVK=.5;
function whInfo(d){return d.wh==='conv'?{n:'Hagyományos töltet',m:d.convMass,y:d.convMass*CONVK/1e6,c:1,mat:0}:WH[d.wh]}
function effR(y){return 0.7*Math.cbrt(y)}            // hatássugár km-ben, köbgyökös skálázás
function build(d,alloy){
  const w=whInfo(d);
  const stages=d.stages.map(s=>{const e=ENG[s.eng];return{e,id:s.eng,n:s.n,prop:s.prop,dry:e.m*s.n+s.prop*e.sf*(alloy||1)+300,F:e.F*s.n,mdot:e.F*s.n/(e.iv*g0)}});
  const m0=w.m+stages.reduce((a,s)=>a+s.dry+s.prop,0);
  let dv=0,m=m0;for(const s of stages){dv+=s.e.iv*g0*Math.log(m/(m-s.prop));m-=s.prop+s.dry}
  const dia=0.7+0.33*Math.cbrt(m0/1000);
  const twr=stages[0].F*stages[0].e.isl/stages[0].e.iv/(m0*g0);
  const cost=3+w.c+d.stages.reduce((a,s)=>a+ENG[s.eng].c*s.n+s.prop*2e-4,0);
  return{w,stages,m0,dv,dia,twr,cost};
}
function pitchProg(d,t){const th=d.pitch*Math.PI/180,s0=d.stages[0],e0=ENG[s0.eng],tb=s0.prop*e0.iv*g0/(e0.F*s0.n),tv=Math.min(8,.2*tb),tr=Math.min(Math.max(1,d.pitch),Math.max(1,.6*tb-tv));return t<tv?0:Math.min(th,th*(t-tv)/tr)}
function pitchAt(d,t,si){return d.goal&&!d.target&&si>0&&si===d.stages.length-1?Math.PI/2:pitchProg(d,t)}
function simulate(d,o={}){
  const B=build(d,o.alloy),w=B.w,A=Math.PI*B.dia*B.dia/4;
  const rvD=0.5+0.22*Math.cbrt(w.m/100),rvA=Math.PI*rvD*rvD/4,hl=o.heatLimit||1e99;
  let x=0,y=RE,vx=0,vy=0,t=0,m=B.m0,si=0,prop=B.stages[0].prop,burning=true,sep=false,lifted=false;
  const last=B.stages.length-1,lastLim=B.stages[last].prop*(1-d.cutoff/100),kick=last>0&&!d.target&&(d.goal==='orb'||d.goal==='hi')&&d.ign!=='now';const hold=last>0&&!d.target&&(d.goal==='orb'||d.goal==='hi'),hT=d.goal==='hi'?1060e3:180e3;let coasting=false,phaseA=false;
  let pts=[],apo=0,maxQ=0,maxHeat=0,vRe=0,out=null,orbit=false,escape=false,lastS=-9,burnT=null,failT=null,rp=0,bo=null,tCap=kick?40000:7200,ev=[],vmax=0;
  while(t<tCap){
    const r=Math.hypot(x,y),h=r-RE,ux=x/r,uy=y/r,tx=uy,ty=-ux,v=Math.hypot(vx,vy);
    const rho=h<150e3?1.225*Math.exp(-h/8500):0;
    const dt=burning?0.05:(h>120e3?1:0.1);
    if(t-lastS>=(burning||h<60e3?0.5:4)){pts.push({t,x,y,h,v,si,b:burning,sep});lastS=t}
    let ax=-MU*x/(r*r*r),ay=-MU*y/(r*r*r);
    const st=B.stages[si];
    if(burning){
      const F=st.F*(1-(1-st.e.isl/st.e.iv)*Math.exp(-h/8500)),a=!(hold&&si===last)?pitchAt(d,t,si):phaseA?pitchProg(d,t):Math.acos(Math.max(0,Math.min(.97,(MU/(r*r)-Math.pow(vx*tx+vy*ty,2)/r-.15*(vx*ux+vy*uy))*m/F)));
      const lim=si===last?lastLim:0,dm0=st.mdot*dt,fr=prop-dm0<lim?Math.max(0,(prop-lim)/dm0):1,dm=dm0*fr;
      ax+=fr*F*(ux*Math.cos(a)+tx*Math.sin(a))/m;ay+=fr*F*(uy*Math.cos(a)+ty*Math.sin(a))/m;
      prop-=dm;m-=dm;
    }
    if(rho>0&&v>1){
      const M=v/300,cd=sep?0.15:(M<.8?.3:M<1.2?.3+.5*(M-.8):Math.max(.25,.5-.06*(M-1.2)));
      const D=.5*rho*v*v*cd*(sep?rvA:A)/m;ax-=D*vx/v;ay-=D*vy/v;
      const q=.5*rho*v*v;if(q>maxQ)maxQ=q;
      if(sep){const hf=1.74e-4*Math.sqrt(rho/0.3)*v*v*v;if(hf>maxHeat)maxHeat=hf;if(hf>hl&&burnT===null)burnT=t}
    }
    vx+=ax*dt;vy+=ay*dt;
    const vr=vx*ux+vy*uy;
    if(phaseA&&burning){const e1=(vx*vx+vy*vy)/2-MU/r,h1=x*vy-y*vx;if(e1>=0||-MU/(2*e1)*(1+Math.sqrt(Math.max(0,1+2*e1*h1*h1/(MU*MU))))-RE>=hT){phaseA=false;burning=false;coasting=true;ev.push({t,k:'coast'})}}
    if(coasting&&vr<=0){coasting=false;burning=true;ev.push({t,k:'ign'})}
    if(!lifted){if(vr<=0){vx=0;vy=0}else lifted=true}
    if(sep&&!vRe&&h<100e3&&vr<0)vRe=v;
    const px=x,py=y;x+=vx*dt;y+=vy*dt;t+=dt;
    if(h>apo)apo=h;if(v>vmax)vmax=v;
    if(burning){
      if(o.failSt===si&&(st.prop-prop)/st.prop>=o.failFrac){out='fail';failT=t;break}
      if(prop<=(si===last?lastLim:0)+1e-6){
        if(si<last){m-=st.dry+Math.max(prop,0);si++;prop=B.stages[si].prop;ev.push({t,k:'sep'});if(kick&&si===last)phaseA=true}
        else{
          burning=false;sep=true;m=w.m;ev.push({t,k:'cut'});
          if(!lifted){out='nolift';break}
          const r2=Math.hypot(x,y),v2=vx*vx+vy*vy,eps=v2/2-MU/r2,hh=x*vy-y*vx;
          bo={h:r2-RE,v:Math.sqrt(v2),vh:Math.abs(hh)/r2,vc:Math.sqrt(MU/r2),ve:Math.sqrt(2*MU/r2),eps,rp:null,ra:null};if(o.boOnly&&eps>=0){out='bo';break}
          if(eps>=0){escape=true;tCap=t+2500}
          else{const a=-MU/(2*eps),e=Math.sqrt(Math.max(0,1+2*eps*hh*hh/(MU*MU)));rp=a*(1-e)-RE;bo.rp=rp;bo.ra=a*(1+e)-RE;bo.T=2*Math.PI*Math.sqrt(a*a*a/MU);if(o.boOnly){out='bo';break}
            if(rp>120e3){orbit=true;tCap=Math.min(t+2*Math.PI*Math.sqrt(a*a*a/MU),t+9000)}else tCap=Math.max(tCap,Math.min(t+2*Math.PI*Math.sqrt(a*a*a/MU)+600,t+90000))}
        }
      }
    }
    if(lifted&&Math.hypot(x,y)<RE){
      const h1=Math.hypot(px,py)-RE,h2=Math.hypot(x,y)-RE,f=h1/(h1-h2);x=px+(x-px)*f;y=py+(y-py)*f;
      out=sep?'impact':'crash';break;
    }
  }
  if(!out){out=orbit?'orbit':escape?'escape':(lifted?'burnup':'nolift');if(out==='burnup'&&burnT===null)burnT=t}
  if(out==='impact'&&burnT!==null)out='burnup';
  pts.push({t,x,y,h:Math.max(0,Math.hypot(x,y)-RE),v:Math.hypot(vx,vy),si,b:burning,sep});
  return{B,pts,out,range:RE*(a=>a<-1e-9?a+2*Math.PI:a)(Math.atan2(x,y)),apo:orbit&&bo&&bo.ra>apo?bo.ra:apo,maxQ,maxHeat,vRe,vmax,orbit,escape,rp,bo,burnT,failT,failSt:o.failSt,ev,tof:t};
}
if(typeof module!=='undefined')module.exports={simulate,build,ENG,WH,effR};
</script>

<script>
/* ---------- Játékállapot ---------- */
const TECH={
  ball:{g:'Irányítás',n:'Ballisztikai számítógép',d:'Indítás előtt kiszámolja a várható lőtávot, csúcsmagasságot és hőterhelést.',c:15,q:1},

function worldTick(){

    if(!R.war)R.conv=Math.min(R.ccap,R.conv+R.cg*R.eco*(R.emb>0?.5:1));if(R.emb>0){R.emb--;R.eco=Math.max(.3,R.eco*.985)}

function rivStrike(R,k,pre,shotsIn){
  const n=Math.min(Math.floor(R.ars),k);if(n<1)return null;R.ars-=n;const shots=shotsIn||[],sum={n,int:0,hit:0,pop:0,mis:0,b:''},src=[R.mx,R.my];

    sum.hit++;
    if(Math.random()<.6){let x=Math.random()*S.cities.reduce((a,c)=>a+c.p,0);const c=S.cities.find(c=>(x-=c.p)<0)||S.cities[0];
      const l=c.p*Math.min(.7,.12+.07*Math.log10(R.y))*(1-.25*(S.bld.ovo||0))*(S.bld.korhaz?.85:1);c.p-=l;sum.pop+=l;shots.push({f:src,to:[c.mx,c.my],res:'hit',t0})}

      if(Math.random()<.3){const ks=Object.keys(S.bld).filter(b=>S.bld[b]>0);if(ks.length){const b=ks[Math.floor(Math.random()*ks.length)];S.bld[b]--;sum.b=BLD[b].n}}

function orbAim(){

  const bo=(p,c)=>{d.pitch=p;d.cutoff=c;return simulate(d,o).bo};
  const ev=p=>{let b=bo(p,100);if(!b)return{m:-1e18,c:100,h:0};if(esc)return{m:b.v-b.ve,c:100,h:0};if(b.eps<0)return{m:b.rp,c:100,h:b.h};
    b=bo(p,10);if(!b||b.eps>=0)return{m:-1e17,c:10,h:0};let lo=10,hi=100,m=b.rp,hh=b.h;
    for(let i=0;i<8;i++){const mid=(lo+hi)/2;b=bo(p,mid);if(b&&b.eps<0){lo=mid;m=b.rp;hh=b.h}else hi=mid}
    return{m,c:lo,h:hh}};
  const better=(a,b)=>{if(esc)return a.m>b.m;const ka=Math.min(a.m,cap),kb=Math.min(b.m,cap);return ka>kb||(ka===kb&&ka===cap&&((a.g||'')===(b.g||'')?a.h<b.h:!a.g))};

  for(const g of esc||d.stages.length<2?['']:['','now']){d.ign=g;for(let p=0;p<=90;p+=5)tr(p)}
  d.ign=best.g;for(const s of[2.5,1,.5]){const p0=bp;tr(p0-s);tr(p0+s)}
  let bc=best.c;
  if(!esc&&best.m>=need){const tgt=Math.min(best.m,need+30e3);let lo=10,hi=bc;for(let i=0;i<10;i++){const mid=(lo+hi)/2,b=bo(bp,mid);b&&b.eps<0&&b.rp>=tgt?hi=mid:lo=mid}bc=hi}
  d.pitch=bp;d.cutoff=Math.round(bc*1000)/1000;const okk=esc?best.m>=0:best.m>=need;

    let tc=end;for(const q of p)if(q.h>20e3){tc=q.t;break}

    if(r.out==='nolift'){PB.T1=3.5;PB.T2=0}
    else if(r.out==='fail'&&r.failT<=tc+.5){PB.tc=r.failT;PB.boomAt=4.5;PB.T1=6.8;PB.T2=0}
    else{PB.T1=6.5;PB.T2=r.out==='orbit'?11:8}

      PB.blast={y:det?w.y:0,nuc:det&&w.nuc,fus:det&&w.fus,lead:1.2,dur:det&&w.nuc?14:4.5,
        off:info.miss!=null&&det&&w.y?-info.miss/effR(w.y):0,offKm:info.miss!=null?-info.miss:null}}

}

    return requestAnimationFrame(frame)}

function flushToasts(){if(!TQ.length)return;const now=Date.now();if(TQ.some(q=>!q.u))TQ.some(q=>q.k==='bad')?SND.alarm():SND.ok();

function mile(t){S.hist.push({q:S.q,t});if(S.hist.length>90)S.hist.shift()}
function histHook(t){LC++;if(HRE.test(t))mile(t)}
function flightStat(r,miss){const st=S.st,good=!['fail','nolift','crash','burnup'].includes(r.out);
  if(good){st.ok++;st.streak++;st.best=Math.max(st.best,st.streak)}else{st.fail++;st.streak=0}
  if(r.out!=='nolift')st.maxApo=Math.max(st.maxApo,Math.min(r.apo/1e3,4e5));
  if(r.out==='impact')st.maxRng=Math.max(st.maxRng,r.range/1e3);
  if(miss!==null){const m=Math.abs(miss);if(st.miss==null||m<st.miss)st.miss=m}
  achCheck()}

function extStart(hot,had){const f=fresh();S.st={...f.st,...S.st};S.opt={...f.opt,...S.opt};LC=0;achCheck(true);for(const k in ENDS)if(had&&!S.ends[k]&&ENDS[k][2]())S.ends[k]=S.q+1;if(!hot)OV={v:'title',has:had}}

/* ---------- Űrverseny (több játékos) ----------
   Heti futam: aki beszáll, új programot kezd (Főkonstruktőr nehézség), és a mérföldkövekért verseng a többiekkel.
   A saját játék közben félre van téve, kilépéskor visszakapod. Az adatok egy nyilvános MQTT üzenetközvetítőn mennek át
   (HiveMQ, mint a Raktár 3D-ben); a gépek közvetlenül nem beszélnek egymással, saját szerver nincs.
   Témák (RACE.cs/...):
     f/<hét>/<azonosító>  – megőrzött (retained) versenylap: {id, nev, q, m:{mérföldkő:[negyedév, időbélyeg]}, l, ok, ts}
     jelen/<azonosító>    – megőrzött jelenlét: {nev, het}; a kapcsolat megszakadásakor a szerver törli (will)
     e                    – élő hírek: {t:'start', id, nev, q, wh, out, won:[...]}
   Rangsor: több mérföldkő előrébb; azonos számnál aki kevesebb negyedév alatt érte el az utolsót. Az „elsőség”
   (az a játékos, aki a héten valós időben elsőként ér el egy mérföldkövet) presztízst és pénzt hoz. */
const RACE={broker:'wss://broker.hivemq.com:8884/mqtt',cs:'loter-urverseny-k7q4z2'};
const RM_IDS=['alt','orbit','crew','esc','station','moon'];
const RM_IKON={alt:'⬆',orbit:'🛰',crew:'👨‍🚀',esc:'🌒',station:'🏗',moon:'🌕'};
const RM_ELSO={alt:[10,40],orbit:[30,150],crew:[30,150],esc:[25,120],station:[30,150],moon:[50,250]}; // [presztízs, M]
function hetKulcs(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);
  const e=t.getUTCFullYear();return `${e}-W${String(Math.ceil(((t-Date.UTC(e,0,1))/864e5+1)/7)).padStart(2,'0')}`}
const raceId=(()=>{let i;try{i=localStorage.getItem('loter-id')}catch(e){}if(!i){i=Math.random().toString(36).slice(2,10);try{localStorage.setItem('loter-id',i)}catch(e){}}return i})();
const NET={k:null,be:false,het:null,lap:{},jelen:{},hirek:[],uzenet:'',kuld:'',toltes:false};
const raceHet=()=>S.race?S.race.het:hetKulcs();
function raceLap(){return{id:raceId,nev:S.name||'Névtelen program',q:S.q,m:S.race.m,l:S.launches,ok:S.st.ok||0,ts:Date.now()}}
// rangsor: [{...lap, en}] – a saját lapunk mindig a legfrissebb helyi állapotból
function raceRang(){const L={...NET.lap};if(S.race&&S.race.het===NET.het)L[raceId]=raceLap();
  const pont=x=>{const ms=Object.values(x.m||{});return[ms.length,ms.length?Math.max(...ms.map(v=>v[0])):x.q,ms.length?Math.max(...ms.map(v=>v[1])):x.ts]};
  return Object.values(L).filter(x=>x&&x.id).map(x=>({...x,en:x.id===raceId,p:pont(x)})).sort((a,b)=>b.p[0]-a.p[0]||a.p[1]-b.p[1]||a.p[2]-b.p[2])}
async function raceKapcsol(){
  if(NET.k||NET.toltes)return;NET.toltes=true;NET.het=raceHet();NET.uzenet='Kapcsolódás…';raceFrissit();
  let mqtt;try{const mod=await import('./vendor/mqtt/mqtt.esm.js');mqtt=mod.default?.connect?mod.default:mod.default?.default??mod}
  catch(e){NET.toltes=false;NET.uzenet='Nem sikerült betölteni a hálózati könyvtárat.';raceFrissit();return}
  const jt=`${RACE.cs}/jelen/${raceId}`;
  NET.k=mqtt.connect(RACE.broker,{clientId:`loter_${raceId}_${Math.random().toString(36).slice(2,6)}`,clean:true,keepalive:30,reconnectPeriod:5000,connectTimeout:10000,
    will:{topic:jt,payload:'',qos:0,retain:true}});NET.toltes=false;
  NET.k.on('connect',()=>{NET.be=true;NET.uzenet='';NET.het=raceHet();
    NET.k.subscribe(`${RACE.cs}/f/${NET.het}/+`);NET.k.subscribe(`${RACE.cs}/jelen/+`);NET.k.subscribe(`${RACE.cs}/e`);
    NET.k.publish(jt,JSON.stringify({nev:S.name||'Névtelen program',het:NET.het,v:S.race?1:0}),{qos:0,retain:true});NET.kuld='';raceSync();raceFrissit()});
  NET.k.on('close',()=>{if(NET.be){NET.be=false;NET.uzenet='A kapcsolat megszakadt, újrapróbálom…';raceFrissit()}});
  NET.k.on('error',e=>console.warn('[űrverseny]',e?.message||e));
  NET.k.on('message',(tema,adat)=>{const s=adat.toString(),r=tema.slice(RACE.cs.length+1).split('/');let o=null;try{o=s?JSON.parse(s):null}catch(e){return}
    if(r[0]==='f'&&r[1]===NET.het){if(r[2]===raceId)return;if(o&&o.id===r[2])NET.lap[r[2]]=raceTiszta(o);else delete NET.lap[r[2]];raceFrissit()}
    else if(r[0]==='jelen'){if(r[1]===raceId)return;if(o)NET.jelen[r[1]]={nev:String(o.nev||'?').slice(0,24),v:!!o.v};else delete NET.jelen[r[1]];raceFrissit()}
    else if(r[0]==='e'&&o&&o.id!==raceId)raceHir(o)})}
function raceTiszta(o){const m={};for(const k of RM_IDS)if(Array.isArray(o.m?.[k])&&o.m[k].every(Number.isFinite))m[k]=[o.m[k][0],o.m[k][1]];
  return{id:String(o.id),nev:String(o.nev||'?').slice(0,24),q:+o.q||0,m,l:+o.l||0,ok:+o.ok||0,ts:+o.ts||0}}
// a saját versenylap küldése, ha változott (minden mentéskor megnézzük)
function raceSync(){if(!S.race||!NET.be||S.race.het!==NET.het)return;const l=raceLap(),k=JSON.stringify({...l,ts:0});if(k===NET.kuld)return;NET.kuld=k;
  NET.k.publish(`${RACE.cs}/f/${S.race.het}/${raceId}`,JSON.stringify(l),{qos:0,retain:true})}
const yQ=q=>1957+Math.floor(q/4);
const misNev=id=>(MIS.find(m=>m.id===id)||{}).n||id;
// mérföldkő a versenyben (a check() hívja)
function raceHook(m){if(!S.race||!RM_IDS.includes(m.id)||S.race.m[m.id])return;const t=Date.now();S.race.m[m.id]=[S.q,t];
  const elotte=Object.values(NET.lap).filter(x=>x.m&&x.m[m.id]&&x.m[m.id][1]<t).length;
  if(elotte===0){const[p,M]=RM_ELSO[m.id];S.prestige+=p;S.money+=M;S.race.elso=(S.race.elso||0)+1;
    log(`Űrverseny: elsőként a világon – ${misNev(m.id)}! +${p} presztízs, +${M} M.`);mile(`Űrverseny: elsőként – ${misNev(m.id)}`);toast(`${RM_IKON[m.id]} Elsőként a világon: ${misNev(m.id)}!`,'ach')}
  else if(elotte===1){S.prestige+=10;log(`Űrverseny: másodikként – ${misNev(m.id)}. +10 presztízs.`);toast(`${RM_IKON[m.id]} Másodikként: ${misNev(m.id)}`,'ok')}
  else log(`Űrverseny: ${elotte+1}. helyen – ${misNev(m.id)}.`)}
// indítás után: hír a többieknek
function raceLaunch(r,d,won){if(!S.race||!NET.be)return;
  NET.k.publish(`${RACE.cs}/e`,JSON.stringify({t:'start',id:raceId,nev:S.name||'Névtelen program',q:S.q,wh:d.wh,out:r.out,won:won.map(m=>m.id).filter(i=>RM_IDS.includes(i))}),{qos:0})}
const RH_OUT={nolift:'a starthelyen maradt',fail:'meghibásodott',crash:'lezuhant',burnup:'elégett a légkörben',orbit:'pályára állt',escape:'szökési pályára állt',impact:'becsapódott a célterületen'};
function raceHir(o){if(o.t!=='start'||!S.race)return;const nev=String(o.nev||'Valaki').slice(0,24),won=(Array.isArray(o.won)?o.won:[]).filter(i=>RM_IDS.includes(i));
  let t;if(won.length){t=`${esc(nev)}: ${won.map(misNev).join(', ')}!`;toast(`${RM_IKON[won[0]]} ${nev} – ${won.map(misNev).join(', ')}`,'ach');log(`Űrverseny: a(z) ${nev} program teljesítette: ${won.map(misNev).join(', ')}.`)}
  else{t=`${esc(nev)} rakétája ${RH_OUT[o.out]||'repült'}.`;if(['fail','crash','nolift','burnup'].includes(o.out))log(`Űrverseny: a(z) ${nev} rakétája ${RH_OUT[o.out]}.`)}
  NET.hirek.unshift({t,ido:Date.now()});NET.hirek.length=Math.min(NET.hirek.length,6);save();raceFrissit();if($('fly').hidden&&!OV)flushToasts()}
// a kártya és a nézet frissítése teljes újrarajzolás nélkül (hogy a beviteli mezők ne vesszenek el)
function raceFrissit(){const el=$('raceCard');if(el)el.outerHTML=raceCard();if(OV&&OV.v==='race')renderOv()}
function raceTabla(max=8){const R=raceRang();if(!R.length)return'<p class="dim">Ezen a héten még senki sem versenyzett. Légy te az első!</p>';
  return`<table class="rtab"><tr><th>#</th><th>Program</th><th>Év</th><th>Mérföldkövek</th></tr>${R.slice(0,max).map((x,i)=>`<tr class="${x.en?'en':''}"><td>${i+1}</td><td>${esc(x.nev)}${x.en?' (te)':''}${NET.jelen[x.id]&&!x.en?' <span class="pill ok">fent</span>':''}</td><td>${yQ(x.q)}</td><td>${RM_IDS.filter(k=>x.m[k]).map(k=>`<span title="${misNev(k)} · ${yQ(x.m[k][0])}">${RM_IKON[k]}${yQ(x.m[k][0])%100}</span>`).join(' ')||'–'}</td></tr>`).join('')}</table>`}
function raceCard(){
  const fent=Object.values(NET.jelen).length;
  if(!S.race)return`<section class="card" id="raceCard" style="border-color:var(--trace)"><div class="eyebrow" style="color:var(--trace)">Űrverseny · több játékos</div><h2>Ki ér elsőként a Holdra?</h2><p class="dim">Heti futam más játékosok ellen: új program indul, és aki elsőként állít műholdat pályára, juttat embert az űrbe vagy ér a Holdra, presztízst és pénzt kap. A mostani játékod félreteszed, kilépéskor visszakapod.</p><button class="act" data-a="raceopen">Űrverseny ↗</button></section>`;
  const R=raceRang(),hely=R.findIndex(x=>x.en)+1;
  return`<section class="card" id="raceCard" style="border-color:var(--trace)"><div class="row"><div class="eyebrow" style="color:var(--trace)">Űrverseny · ${S.race.het}</div><span class="pill ${NET.be?'ok':''}">${NET.be?`${fent+1} fent`:'nincs kapcsolat'}</span></div>
    <h2>${hely?`${hely}. hely / ${R.length}`:'Futam'}</h2>${NET.uzenet?`<p class="dim">${NET.uzenet}</p>`:''}${raceTabla(5)}
    ${NET.hirek.length?`<div class="log">${NET.hirek.slice(0,4).map(h=>`<div>${h.t}</div>`).join('')}</div>`:''}
    <div class="fine"><button class="sec" data-a="raceopen">Teljes állás</button></div></section>`}
function raceOv(){const most=hetKulcs(),r=S.race;let tarolt=null;try{tarolt=JSON.parse(localStorage.getItem('loter1-verseny'))}catch(e){}
  const folyt=!r&&tarolt&&tarolt.race&&tarolt.race.het===most&&!tarolt.over;
  let h=`<div class="row"><h2>Űrverseny</h2><button class="sec" data-a="ovclose">Bezárás</button></div>
    <p class="dim">Heti futam: hétfőn új kezdődik. Mindenki Főkonstruktőr nehézségen, 1957-től indul. A rangsor a mérföldkövek száma, azonos számnál az, aki kevesebb negyedév alatt érte el az utolsót. Aki a héten valós időben elsőként ér el egy mérföldkövet, presztízst és pénzt kap; a többiek indításairól hírek jönnek.</p>
    <section class="card"><div class="row"><h3>${r?r.het:most} · állás</h3><span class="pill ${NET.be?'ok':''}">${NET.be?`${Object.keys(NET.jelen).length+(r?1:0)} fent`:NET.uzenet||'kapcsolódás…'}</span></div>${raceTabla(20)}</section>`;
  if(r){h+=r.het!==most?`<p><span class="pill bad">Lezárult</span> Ez a futam véget ért; az új hét futamához lépj ki, és szállj be újra.</p>`:'';
    h+=`<button class="sec" data-a="raceki">Vissza a saját programomhoz</button><p class="dim">A versenyjátékod megmarad: a héten bármikor folytathatod.</p>`}
  else h+=`<label for="rname">A versenyprogram neve</label><input type="text" id="rname" maxlength="24" placeholder="például Hajnalcsillag" value="${esc(OV.name??(folyt?tarolt.name:S.name)??'')}">
    <button class="act" data-a="racebe">${folyt?'Versenyjáték folytatása':'Beszállok a futamba'}</button><p class="dim">A mostani játékod félrekerül, kilépéskor pontosan ott folytatod, ahol abbahagytad. A versenyben a mentéskód betöltése nem működik.</p>`;
  h+=`<p class="dim kicsi">A program neve és a versenyállásod egy nyilvános, ingyenes üzenetközvetítőn (HiveMQ) megy át a többi játékoshoz; más adat nem.</p>`;
  return h}
function raceBe(){const nev=(($('rname')||{}).value||'').trim().slice(0,24),most=hetKulcs();
  try{localStorage.setItem('loter1-sajat',JSON.stringify(S))}catch(e){}
  let t=null;try{t=JSON.parse(localStorage.getItem('loter1-verseny'))}catch(e){}
  if(t&&t.race&&t.race.het===most&&!t.over){start(t);if(nev)S.name=nev}
  else{newGame('n',nev);S.race={het:most,m:{},t0:Date.now()};S.log.unshift('Űrverseny: beszálltál a heti futamba. Az első, aki pályára állít egy műholdat, elsőségi jutalmat kap.')}
  OV=null;S.tab='prog';NET.kuld='';
  if(NET.k){NET.k.end(true);NET.k=null;NET.be=false;NET.lap={};NET.jelen={}}raceKapcsol();save();render()}
function raceKi(){try{localStorage.setItem('loter1-verseny',JSON.stringify(S))}catch(e){}
  let s=null;try{s=JSON.parse(localStorage.getItem('loter1-sajat'))}catch(e){}
  if(NET.k)NET.k.publish(`${RACE.cs}/jelen/${raceId}`,JSON.stringify({nev:S.name||'?',het:NET.het,v:0}),{qos:0,retain:true});
  if(s&&s.design&&s.rel){start(s);try{localStorage.removeItem('loter1-sajat')}catch(e){}}else{newGame(S.diff||'n',S.name||'');delete S.race}
  OV=null;save();render()}

/* ---------- Indulás ---------- */
function start(snap){
  let s=snap&&snap.q!=null?snap:null;
  if(!s)try{s=JSON.parse(localStorage.getItem('loter1'))}catch(e){}
  if(s&&s.design&&s.rel){S=Object.assign(fresh(),s,{rel:{...fresh().rel,...s.rel}});S.riv=S.riv.map(r=>({...fresh().riv.find(x=>x.id===r.id),...r}));
  if(!s.v5){S.v5=1;const y0={N:20,K:50,D:15};for(const R of S.riv){const q=Math.max(0,R.t-R.t0);R.ars=Math.min(R.ars,R.cap,R.gr*q);R.y=Math.min(R.y,y0[R.id]*Math.pow(1.05,q));R.def=Math.min(R.def,.005*q)}}
  if(!s.done){S.done={};['alt','z300','z1500','test','k1500','z5000','k9000','orbit'].slice(0,s.mission||0).forEach(i=>S.done[i]=1)}}
  extStart(!!(snap&&snap.q!=null),!!(s&&s.design&&s.rel));render();if(S.race)raceKapcsol();
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
